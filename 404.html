  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-pill: 100px;

  --t-slow: 350ms;
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

    --cream-3: #1e3a5f;
    --ink: #f8fafc;

}

  --ink: #f8fafc; --ink-2: #cbd5e1; --ink-3: #94a3b8;

}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  position: relative;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
/* Decorative blobs — sourcés depuis vars pour suivre le thème */
.blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.3;
  pointer-events: none;
}
.blob-1 { width: 350px; height: 350px; background: var(--pink); top: -80px; right: -80px; }
.blob-2 { width: 300px; height: 300px; background: var(--cream-3); bottom: -60px; left: -60px; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) .blob { opacity: 0.15; }
}
[data-theme="midnight"] .blob { opacity: 0.15; }
main {
  position: relative;
  z-index: 2;
  max-width: 540px;
  text-align: center;
}
.code {
  font-size: clamp(120px, 22vw, 200px);
  font-weight: 700;
  line-height: 1;
  color: var(--pink-deep);
  letter-spacing: -0.05em;
  margin-bottom: 16px;
  font-family: 'Space Grotesk', sans-serif;
}
h1 {
  font-size: clamp(28px, 5vw, 38px);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.02em;
  margin-bottom: 16px;
  color: var(--ink);
}
h1 em {
  display: inline-block;
  background: var(--pink);
  padding: 0 12px 4px;
  border-radius: 12px;
  transform: rotate(-1.5deg);
  font-style: normal;
  color: var(--ink);
}
p {
  color: var(--ink-2);
  font-size: 17px;
  line-height: 1.6;
  margin-bottom: 32px;
  font-weight: 500;
}
.cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 16px 28px;
  background: var(--pink-deep);
  color: white;
  text-decoration: none;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 16px;
  border-radius: 100px;
  box-shadow: var(--shadow-pink);
  transition: all var(--t-base) var(--ease-spring);
}
.cta:hover {
  background: var(--pink-darker);
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(236, 72, 153, 0.4);
  gap: 14px;
}
.cta:active { transform: scale(0.97); }
.cta::after { content: '→'; font-size: 18px; transition: transform var(--t-base); }
.cta:hover::after { transform: translateX(2px); }
.cta:focus-visible { outline: 2.5px solid var(--pink-deep); outline-offset: 4px; }
::selection { background: var(--pink); color: var(--ink); }

footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 3;
  padding: 16px 24px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-3);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 12px 24px;
  letter-spacing: 0.02em;
}
footer .footer-left {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  align-items: baseline;
}
footer .credit { color: var(--ink-3); }
footer a, footer .source-link { color: var(--ink-3); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color var(--t-base), color var(--t-base); }
footer a:hover, footer .source-link:hover { color: var(--pink-deep); border-bottom-color: var(--pink-deep); }
footer .domain strong { color: var(--pink-deep); font-weight: 700; }
@media (max-width: 600px) {
  footer { font-size: 11px; padding: 12px 18px; }
  body { padding-bottom: 100px; } /* leave room for fixed footer */
}
</style>
<script>

// ════════════════════════════════════════════════════════════════
const AMBIANCE_VALUES = ['pop', 'midnight', 'sunset', 'cyber', 'matcha', 'tryme'];
const AMBIANCE_LEGACY = { 'light': 'pop', 'dark': 'midnight' }; // migration

const TRYME_PALETTES = [

  { label: 'Bordeaux ivoire', cream: '#fef2f2', cream2: '#fecaca', cream3: '#fca5a5', white: '#fff8f8', whiteLine: '#fcc1c1', ink: '#450a0a', ink2: '#7f1d1d', ink3: '#991b1b', electric: '#991b1b', pink: '#a16207' },
  { label: 'Lavande nuit', cream: '#f5f3ff', cream2: '#ddd6fe', cream3: '#c4b5fd', white: '#fbfaff', whiteLine: '#d4cbfb', ink: '#2e1065', ink2: '#4c1d95', ink3: '#5b21b6', electric: '#6d28d9', pink: '#be185d' },
  { label: 'Citron vert', cream: '#f7fee7', cream2: '#d9f99d', cream3: '#bef264', white: '#fcfff5', whiteLine: '#cef090', ink: '#1a2e05', ink2: '#365314', ink3: '#4d7c0f', electric: '#4d7c0f', pink: '#a16207' },
  { label: 'Chêne brun', cream: '#fafaf9', cream2: '#d6d3d1', cream3: '#a8a29e', white: '#fdfcfb', whiteLine: '#cdc9c5', ink: '#1c1917', ink2: '#44403c', ink3: '#57534e', electric: '#78350f', pink: '#92400e' },
  { label: 'Sarcelle profonde', cream: '#f0fdfa', cream2: '#99f6e4', cream3: '#5eead4', white: '#f8fefd', whiteLine: '#90efdd', ink: '#042f2e', ink2: '#134e4a', ink3: '#115e59', electric: '#115e59', pink: '#0f766e' },
  { label: 'Terracotta', cream: '#fffbf5', cream2: '#fed7aa', cream3: '#fdba74', white: '#fffdfa', whiteLine: '#fcd0a3', ink: '#422006', ink2: '#7c2d12', ink3: '#9a3412', electric: '#9a3412', pink: '#b91c1c' },
  { label: 'Marrakech', cream: '#fef3c7', cream2: '#fcd34d', cream3: '#fbbf24', white: '#fffaeb', whiteLine: '#fbcb3a', ink: '#451a03', ink2: '#78350f', ink3: '#9a3412', electric: '#c2410c', pink: '#15803d' },
  { label: 'Brutaliste', cream: '#ffffff', cream2: '#e4e4e7', cream3: '#a1a1aa', white: '#ffffff', whiteLine: '#18181b', ink: '#18181b', ink2: '#27272a', ink3: '#52525b', electric: '#18181b', pink: '#18181b' },
  { label: 'Framboise', cream: '#fff1f2', cream2: '#fecdd3', cream3: '#fda4af', white: '#fffafb', whiteLine: '#fbc0c8', ink: '#4c0519', ink2: '#881337', ink3: '#9f1239', electric: '#be123c', pink: '#9d174d' },
  { label: 'Synthwave', cream: '#1a0b2e', cream2: '#2d1b4e', cream3: '#4c1d95', white: '#241540', whiteLine: '#5b21b6', ink: '#f5f3ff', ink2: '#ddd6fe', ink3: '#c4b5fd', electric: '#f0abfc', pink: '#22d3ee' },
  { label: 'Terminal', cream: '#0a0e0a', cream2: '#0f1a13', cream3: '#065f46', white: '#0d1410', whiteLine: '#047857', ink: '#d1fae5', ink2: '#a7f3d0', ink3: '#6ee7b7', electric: '#34d399', pink: '#22d3ee' },
  { label: 'GitHub nuit', cream: '#0c1117', cream2: '#161b22', cream3: '#1e293b', white: '#10161e', whiteLine: '#30363d', ink: '#e6edf3', ink2: '#cbd5e1', ink3: '#94a3b8', electric: '#fbbf24', pink: '#fb7185' },
  { label: 'Bois & or', cream: '#1a1410', cream2: '#2a1f17', cream3: '#78350f', white: '#241a14', whiteLine: '#92400e', ink: '#fef3c7', ink2: '#fde68a', ink3: '#fcd34d', electric: '#fbbf24', pink: '#f97316' },
  { label: 'Forêt nuit', cream: '#0d1f17', cream2: '#15301f', cream3: '#14532d', white: '#102a1a', whiteLine: '#166534', ink: '#d1fae5', ink2: '#bbf7d0', ink3: '#86efac', electric: '#fb923c', pink: '#fbbf24' },
  { label: 'Velours rouge', cream: '#1a0d0d', cream2: '#2a1414', cream3: '#7f1d1d', white: '#241010', whiteLine: '#991b1b', ink: '#fee2e2', ink2: '#fecaca', ink3: '#fca5a5', electric: '#f87171', pink: '#fb923c' },
  { label: 'Vapor', cream: '#18181b', cream2: '#27272a', cream3: '#3f3f46', white: '#1f1f23', whiteLine: '#52525b', ink: '#fafafa', ink2: '#d4d4d8', ink3: '#a1a1aa', electric: '#f472b6', pink: '#22d3ee' },
  { label: 'Indigo galaxie', cream: '#0e0a1a', cream2: '#1a1735', cream3: '#312e81', white: '#181030', whiteLine: '#4338ca', ink: '#e0e7ff', ink2: '#c7d2fe', ink3: '#a5b4fc', electric: '#818cf8', pink: '#f472b6' }
];

function applyTryMePalette(idx) {
  const p = TRYME_PALETTES[idx];
  if(!p) return;
  const root = document.documentElement;
  root.style.setProperty('--cream',         p.cream);
  root.style.setProperty('--cream-2',       p.cream2);
  root.style.setProperty('--cream-3',       p.cream3);
  root.style.setProperty('--white',         p.white);
  root.style.setProperty('--white-line',    p.whiteLine);
  root.style.setProperty('--ink',           p.ink);
  root.style.setProperty('--ink-2',         p.ink2);
  root.style.setProperty('--ink-3',         p.ink3);
  root.style.setProperty('--electric',      p.electric);
  root.style.setProperty('--pink',          p.pink);
  root.style.setProperty('--pink-deep',     p.pink);
  root.style.setProperty('--pink-darker',   p.pink);
}

// Restaurer l'ambiance choisie par l'utilisateur sur les autres pages.
// Si pas de préférence stockée : la media query CSS prend le relais (light/dark auto).
(function(){
  try {
    var saved = localStorage.getItem('theme');
    if(saved && AMBIANCE_LEGACY[saved]) saved = AMBIANCE_LEGACY[saved];
    if(saved && AMBIANCE_VALUES.indexOf(saved) >= 0) {
      document.documentElement.setAttribute('data-theme', saved);
      // Pour TryMe, restaurer la palette tirée précédemment depuis localStorage
      if(saved === 'tryme') {
        var idx = parseInt(localStorage.getItem('tryme_palette_idx'), 10);
        if(!isNaN(idx) && idx >= 0 && idx < TRYME_PALETTES.length) {
          applyTryMePalette(idx);
        }
      }
    }
  } catch(e) {}
})();
// ════════════════════════════════════════════════════════════════
// END AMBIANCE & TRYME shared block
// ════════════════════════════════════════════════════════════════
</script>

  <p>Tu es peut-être tombé sur une URL périmée, mal recopiée, ou un lien cassé.</p>

</main>

  </div>
  <span>2026</span>
</footer>
</body>
